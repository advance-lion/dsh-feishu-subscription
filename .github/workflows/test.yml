name: Plugin regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create ephemeral fixture encryption key
        shell: bash
        run: node -e "const k=require('crypto').randomBytes(32).toString('base64'); console.log('::add-mask::'+k); require('fs').appendFileSync(process.env.GITHUB_ENV, 'FEISHU_SUBSCRIPTION_VAULT_KEY=' + k + '\n')"
      - run: npm test
      - run: npm pack --ignore-scripts
